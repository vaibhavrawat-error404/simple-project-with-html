<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Feedback / Survey Form Page</title>
</head>
<body>
    <header>
        <h1><big>Course Feedback Form</big></h1>
        <nav>
            <a href="#personalinfo">PERSONAL INFORMATION:</a><br>
            <a href="#rating">COURSE RATING:</a><br>
            <a href="#topics">COVERED TOPICS:</a><br>
            <a href="#sem">SEMESTER:</a><br>
            <a href="#comment">COMMENT:</a><br>
            <a href="#grade">GRADING CRITERIA:</a><br>
            <a href="#fill">INSTRUCTIONS TO FILL FORM:</a><br>
            <a href="#submit">SUBMIT</a><br>
       
        </nav>

    </header>
    <hr>
    <MAIN>
        <form>
        <ul>
             
            <li><section id="personalinfo">
                <h3>PERSONAL INFORMATION</h3>
                <br>
            
                <label for="name">NAME:</label>
                    <input type="text" placeholder="Enter your name" required="true"><br><br>
                <label for="email">EMAIL:</label>
                    <input type="text" placeholder="Enter your email" required="true"><br><br>
                <label for="phone">PHONE NUMBER:</label>
                    <input type="text" placeholder="Enter your Phone number " required="true"><br><br>
            
                </section>
            </li>

            <br><br>

            <li>
                <section id="rating">
                    <h3>COURSE RATINGS</h3>
                    
                    <label for="Excellent">Excellent</label>
                        <input type="radio" id="Excellent" name="rate" value="Excellent">
                    <label for="Good">Good</label>
                        <input type="radio" id="Good" name="rate" value="Good">
                    <label for="Average">Average</label>
                        <input type="radio" id="Average" name="rate" value="Average">
                    <label for="Poor">Poor</label>
                        <input type="radio" id="Poor" name="rate" value="Poor">
                </section>

            </li>
            <br><br>
            <li>
                <section id="topics">
                    <h3>COVERED TOPICS</h3>
                    <ol type="1">
                    <li><label for="Maths1">Maths1</label>
                        <input type="checkbox"  id="Maths1" value="Maths1" name="topics" ><br>
                    </li>
                    <li><label for="Chemistry">Chemistry</label>
                        <input type="checkbox"  id="Chemistry" value="Chemistry" name="topics" ><br>
                    </li>
                    <li><label for="Physics">Physics</label>
                        <input type="checkbox"  id="Physics" value="Physics" name="topics" ><br>
                    </li>
                    <li><label for="PPS">PPS</label>
                        <input type="checkbox"  id="PPS" value="PPS" name="topics" ><br>
                    </li>
                    <li><label for="Communcation Skills">Communcation Skills</label>
                        <input type="checkbox"  id="Communcation Skills" value="Communcation Skills" name="topics" ><br>
                    </li>
                    <li><label for="Basic Electrical Engineering">Basic Electrical Engineering</label>
                        <input type="checkbox"  id="Basic Electrical Engineering" value="Basic Electrical Engineering" name="topics" ><br>
                    </li>
                    </ol>                                               
                </section>
            </li>
            
  
        </ul>
        </form>
    </MAIN>
    
</body>
</html>
